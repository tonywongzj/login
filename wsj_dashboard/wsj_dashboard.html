  body {

    padding: 32px 20px 64px;

    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 40px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px 20px;

  .card-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .card-value { font-size: 32px; font-weight: 700; margin-bottom: 12px; }
  .card-value small { font-size: 15px; font-weight: 400; color: var(--text-muted); }

    position: relative;
    height: 8px;
    border-radius: 4px;
    margin-bottom: 6px;
  }
  .meter-marker {
    position: absolute;
    top: -4px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid var(--surface);
    transform: translateX(-50%);
  }
  .meter-poles {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 14px;
  }

  .sparkline { display: block; margin-bottom: 14px; }

  .card-comment {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.7;
  }

  .history-table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);

  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td {

    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th { color: var(--text-muted); font-weight: 600; font-size: 12px; }
  td.num { font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }

  .empty-state { color: var(--text-muted); font-size: 14px; padding: 24px; }
</style>
</head>

  if (score <= 3) return "var(--pole-red)";
  if (score >= 8) return "var(--pole-blue)";
  return "var(--text-muted)";
}

function renderSparkline(values, kind) {
  if (!values || values.length < 2) return "";
  const w = 180, h = 32, pad = 4;
  const min = 1, max = 10;
  const stepX = (w - pad * 2) / (values.length - 1);
  const color = kind === "sequential" ? "var(--seq-400)" : "var(--pole-blue)";
  const points = values.map((v, i) => {
    const x = pad + i * stepX;
    const y = h - pad - ((v - min) / (max - min)) * (h - pad * 2);
    return [x, y];
  });
  const path = points.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const last = points[points.length - 1];
  return `<svg class="sparkline" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2"/>
  </svg>`;
}

function renderCards() {
  const el = document.getElementById("cardsRoot");
  if (REPORTS.length === 0) {
    el.innerHTML = `<div class="empty-state">暂无数据。<br>把当天 WSJ 这四个板块的文章标题发给我，我分析完会把结果写进这个文件的 REPORTS 数组里，你保存后刷新浏览器就能看到。</div>`;
    return;
  }

  const latest = REPORTS[REPORTS.length - 1];
  let html = `<div class="grid">`;

  INDICATORS.forEach(ind => {
    const entry = latest[ind.key];
    const history = REPORTS.map(r => r[ind.key] && r[ind.key].score).filter(v => v !== undefined);
    const pct = ((entry.score - 1) / 9) * 100;

    html += `
      <div class="card">
        <div class="card-label">${ind.label}</div>
        <div class="card-value">${entry.score}<small>/10</small></div>
        <div class="meter" style="background:${meterBackground(ind.kind)}">
          <div class="meter-marker" style="left:${pct}%; background:${markerColor(ind.kind, entry.score)}"></div>
        </div>
        <div class="meter-poles"><span>${ind.loLabel}</span><span>${ind.hiLabel}</span></div>
        ${renderSparkline(history, ind.kind)}
        <div class="card-comment">${entry.comment}</div>
      </div>`;
  });

  html += `</div>`;
  el.innerHTML = html;

  const meta = document.createElement("p");
  meta.className = "subtitle";
  meta.style.marginTop = "-20px";
  meta.textContent = "最新一期日期：" + latest.date;
  el.parentNode.insertBefore(meta, el);
}

function renderHistory() {
  const el = document.getElementById("historyBody");
  if (REPORTS.length === 0) {
    el.innerHTML = `<div style="padding:18px; color:var(--text-muted); font-size:13px;">暂无历史记录</div>`;
    return;
  }
  let html = `<table><thead><tr>
    <th>日期</th>
    ${INDICATORS.map(i => `<th>${i.label}</th>`).join("")}
  </tr></thead><tbody>`;
  [...REPORTS].reverse().forEach(r => {
    html += `<tr><td class="num">${r.date}</td>${INDICATORS.map(i => `<td class="num">${r[i.key] ? r[i.key].score : "-"}</td>`).join("")}</tr>`;
  });
  html += `</tbody></table>`;
  el.innerHTML = html;
}

renderCards();
renderHistory();
</script>

</body>
</html>
