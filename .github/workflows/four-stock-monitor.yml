name: 四标纪律监控

on:
  schedule:
    # 盘中巡检：北京时间 09:00–16:30 每 30 分钟（UTC 01:00–08:30）
    - cron: '*/30 1-8 * * 1-5'
    # 收盘日报：北京时间 17:30（UTC 09:30）
    - cron: '30 9 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily = 收盘日报，intraday = 盘中巡检'
        type: choice
        options: [daily, intraday]
        default: daily
      force:
        description: '忽略休市判断与去重，强制运行并推送'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: four-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 选择模式
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 9 * * 1-5" ]; then
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          else
            echo "mode=intraday" >> "$GITHUB_OUTPUT"
          fi

      - name: 单元测试
        working-directory: four_stock_monitor
        run: node --test test/*.test.mjs

      - name: 运行监控
        working-directory: four_stock_monitor
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          NOTIFY_GITHUB_ISSUE: ${{ vars.NOTIFY_GITHUB_ISSUE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node monitor.mjs --mode "${{ steps.mode.outputs.mode }}" ${{ inputs.force && '--force' || '' }}

      - name: 提交日报与提醒状态
        run: |
          git config user.name "four-stock-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add four_stock_monitor/daily four_stock_monitor/state 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变更"
            exit 0
          fi
          git commit -m "monitor: ${{ steps.mode.outputs.mode }} $(TZ=Asia/Shanghai date +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
