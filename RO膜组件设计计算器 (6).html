/* ═══════════════ 工具函数 ═══════════════ */
const lpmToGPD  = l   => l * 1440 / 3.785411784;
const mpaToPs   = mpa => mpa * 145.037738;
const roundHalf = n   => Math.round(n * 2) / 2;

function interpPsiCoeff(psi) {
  const keys = Object.keys(PSI_COEFF).map(Number).sort((a,b)=>a-b);
  if (psi <= keys[0]) return PSI_COEFF[keys[0]];
  if (psi >= keys[keys.length-1]) return PSI_COEFF[keys[keys.length-1]];
  for (let i=0; i<keys.length-1; i++) {
    if (psi >= keys[i] && psi <= keys[i+1]) {
      const t = (psi-keys[i])/(keys[i+1]-keys[i]);
      return PSI_COEFF[keys[i]] + t*(PSI_COEFF[keys[i+1]]-PSI_COEFF[keys[i]]);
    }
  }
  return 1;
}

function findOdRow(pages) {
  let closest = OD_TABLE[0];
  let minDiff = Infinity;
  for (const row of OD_TABLE) {
    const d = Math.abs(row.pages - pages);
    if (d < minDiff) { minDiff = d; closest = row; }
  }
  return closest;
}

function calcTheoOD(pages, widthMm, meshMil, guideMil, coreMm) {
  const core    = coreMm || 17;
  const meshMm  = meshMil  * 0.0254;
  const guideMm = guideMil * 0.0254;
  const tEff    = 2*(0.135 + meshMm/2 + guideMm/2 + 0.05);
  const od2     = core*core + (4/Math.PI)*pages*widthMm*tEff;
  return Math.sqrt(od2);
}

function generateBOM({pages, mem, elem, odMm, mesh, guide, includeEndCap}) {
  const C       = elem.activeLen;             // C值：有效膜长 mm
  const memWidth = C - 30;                    // 膜宽 = C - 15×2 mm
  const memWidthM = memWidth / 1000;          // m
  const odM   = odMm/1000;
  const memQ  = (pages * memWidthM).toFixed(3);
  const meshQ = (pages * memWidthM * 2.21).toFixed(3);
  const guideQ= (pages * memWidthM * 2.43).toFixed(3);
  const outerT= (Math.PI * odM * 2.5).toFixed(4);
  const sealT = (Math.PI * odM * 5.3).toFixed(4);
  const glueA = (pages * 3.93).toFixed(2);
  const glueB = (pages * 4.37).toFixed(2);
  const rows = [
    {code:"",       desc:`${mem.name}（${mem.brand}）膜片，膜宽${memWidth}mm（C${C}-30）`, qty:memQ,   unit:"M",  scrap:"1%",  remark:`${memWidthM.toFixed(3)}m/页 × ${pages}页`},
    {code:"",       desc:`浓水网格 ${mesh}mil × ${memWidth}mm宽`,                            qty:meshQ,  unit:"M",  scrap:"1%",  remark:`${(memWidthM*2.21*1000).toFixed(0)}mm/页 × ${pages}页`},
    {code:"",       desc:`纯水导布 ${guide}mil × ${memWidth}mm宽`,                           qty:guideQ, unit:"M",  scrap:"1%",  remark:`${(memWidthM*2.43*1000).toFixed(0)}mm/页 × ${pages}页`},
    {code:"503254", desc:"白色外胶带（254mm宽）兰奇帕",                                            qty:outerT, unit:"M",  scrap:"1%",  remark:"外径×π×2.5"},
    {code:"410003", desc:"10寸中心管（蓝色）",                                                     qty:"1",    unit:"EA", scrap:"1%",  remark:""},
    {code:"801005", desc:"RO产品标签，原料，HSD",                                                  qty:"1",    unit:"EA", scrap:"0",   remark:""},
    {code:"602001", desc:"O型圈 12.37×2.62",                                                      qty:"2",    unit:"EA", scrap:"0",   remark:""},
  ];
  if (includeEndCap) {
    rows.push({code:"900035", desc:`${elem.id}端盖（含密封圈）`, qty:"1", unit:"EA", scrap:"0", remark:"按需选配"});
  }
  rows.push(
    {code:"701003", desc:"密封圈胶带（1\"宽，白色）",              qty:sealT,  unit:"M",  scrap:"0",  remark:""},
    {code:"900017", desc:"富乐胶水 3519A",                          qty:glueA,  unit:"G",  scrap:"0",  remark:`${(pages*3.93).toFixed(2)}g / 台`},
    {code:"900018", desc:"富乐胶水 3519B",                          qty:glueB,  unit:"G",  scrap:"0",  remark:`${(pages*4.37).toFixed(2)}g / 台`},
    {code:"900001", desc:"双面胶",                                   qty:"0.5",  unit:"FT", scrap:"0",  remark:""},
    {code:"900002", desc:"保护胶带",                                  qty:"0.5",  unit:"FT", scrap:"0",  remark:""},
    {code:"803002", desc:`真空包装袋（${elem.id}用）`,               qty:"1",    unit:"EA", scrap:"0",  remark:""},
    {code:"804003", desc:"滤芯纸箱",                                  qty:"0.05", unit:"EA", scrap:"0",  remark:"20件/箱"},
    {code:"804005", desc:"纸箱内衬",                                  qty:"0.05", unit:"EA", scrap:"0",  remark:""},

}

/* ═══════════════ 主组件 ═══════════════ */
function App() {
  // 基本信息
  const [customer,   setCustomer]  = useState("");

  const [customPN,   setPN]        = useState("");
  const [rev,        setRev]       = useState("A");

  // 性能参数
  const [initFlow,  setInitFlow]  = useState("0.5");
  const [endFlow,   setEndFlow]   = useState("0.35");
  const [initPres,  setInitPres]  = useState("0.60");
  const [endPres,   setEndPres]   = useState("0.80");
  const [initRec,   setInitRec]   = useState("50");
  const [endRec,    setEndRec]    = useState("50");
  const [lifeRec,   setLifeRec]   = useState("50");
  const [saltRej,   setSaltRej]   = useState("96");
  const [waterEff,  setWaterEff]  = useState("");
  const [totalPure, setTotalPure] = useState("");

  // 设计参数
  const [memId,    setMemId]    = useState("ULPC");
  const [fluxMode, setFluxMode] = useState("250");  // "250"=标准测试 | "500"=水效校正
  const [elemId,   setElemId]   = useState("2812");
  const [designEff,setDesignEff]= useState("0.85");
  const [manualPageCorr, setManualPageCorr] = useState(""); // 手动覆盖页数非线性系数
  const [targetOD, setTargetOD] = useState("");
  const [endCap,   setEndCap]   = useState(false);
  const [customPages, setCustomPages] = useState("");  // 手动指定页数
  // 元件自定义尺寸（覆盖标准值）
  const [customA,  setCustomA]  = useState("");  // A: 壳体外径
  const [customC,  setCustomC]  = useState("");  // C: 膜长度（壳体）
  const [customE,  setCustomE]  = useState("");  // E: 中心管直径

  // 核心计算
  const R = useMemo(() => {
    const mem  = MEMBRANES.find(m=>m.id===memId)  || MEMBRANES[0];
    const elemBase = ELEMENT_TYPES.find(e=>e.id===elemId) || null;

    // ACE 优先
    const hasA = parseFloat(customA) > 0;
    const hasC = parseFloat(customC) > 0;
    const hasE = parseFloat(customE) > 0;

    const effA = hasA ? parseFloat(customA) : (elemBase ? elemBase.nomA : 70);
    const effC = hasC ? parseFloat(customC) : (elemBase ? elemBase.nomC : 305);
    const effE = hasE ? parseFloat(customE) : (elemBase ? elemBase.nomE : 13);

    // C值 = 有效膜长（用户直接输入，无需再推算），直接使用
    // 标准型号的 activeLen 同理也是有效膜长
    const effActiveLen = hasC ? parseFloat(customC) : (elemBase ? elemBase.activeLen : 235);

    const srcA = hasA ? "custom" : (elemBase ? "standard" : "default");
    const srcC = hasC ? "custom" : (elemBase ? "standard" : "default");
    const srcE = hasE ? "custom" : (elemBase ? "standard" : "default");

    const elem = {
      id: elemBase ? elemBase.id : "custom",
      name: elemBase ? elemBase.name : "自定义",
      nomA: effA, nomC: effC, nomE: effE,
      activeLen: effActiveLen,
      srcA, srcC, srcE,
    };

    const iFlow = parseFloat(initFlow)||0;
    const iPres = parseFloat(initPres)||0.6;
    const iFlowGPD = lpmToGPD(iFlow);
    const iPSI     = mpaToPs(iPres);
    const coeff    = interpPsiCoeff(iPSI);
    const eta      = parseFloat(designEff)||0.85;

    // 根据工况模式选取基准通量
    const baseFlux = fluxMode === "500" ? (mem.flux65_500 || mem.flux65) : mem.flux65;

    // 第3步：膜宽 = C - 15×2（有效膜长扣除两端各15mm）
    const memWidth  = effActiveLen - 30;
    // 第7步：单页膜面积 = 0.94 × 膜宽
    const pageArea  = 0.94 * memWidth / 1000;   // m²/页

    // 先用η初算页数（未修正），再用页数查非线性系数迭代一次
    const fluxAtP_raw = baseFlux * coeff * eta;
    const rawPg_pre   = (iFlowGPD / fluxAtP_raw) / pageArea;
    const autoPg_pre  = Math.max(1.5, roundHalf(rawPg_pre));
    const estPages    = parseFloat(customPages)||0 ? parseFloat(customPages) : autoPg_pre;

    // 页数非线性修正系数（来源：样品sheet实测数据统计，以4-5页为基准=1.00）
    // 数据说明：批次差异较大，以下为统计趋势值，建议结合打样反推模块校准
    const PAGE_CORR_TABLE = [
      {maxPg:3,   corr:1.00},  // 2-3页：数据含低通量膜混淆，保守取1.00
      {maxPg:5.5, corr:1.00},  // 4-5页：基准段
      {maxPg:8.5, corr:0.96},  // 6-8页：实测-4%
      {maxPg:11.5,corr:0.97},  // 9-11页：实测-3%（数据较散）
      {maxPg:99,  corr:0.88},  // 12页+：实测-12%（样本少，参考用）
    ];
    const getPageCorr = (pg) => {
      if (parseFloat(manualPageCorr) > 0) return parseFloat(manualPageCorr);
      for (const row of PAGE_CORR_TABLE) { if (pg <= row.maxPg) return row.corr; }
      return 0.88;
    };
    const pageCorrFactor = getPageCorr(estPages);
    const fluxAtP   = baseFlux * coeff * eta * pageCorrFactor;
    const reqArea   = iFlowGPD / fluxAtP;
    const rawPg     = reqArea / pageArea;
    const autoPg    = Math.max(1.5, roundHalf(rawPg));
    const pages     = parseFloat(customPages)||0 ? parseFloat(customPages) : autoPg;
    const odRow     = findOdRow(pages);
    const theoOD    = calcTheoOD(pages, mem.width*1000, odRow.mesh, odRow.guide, effE);
    const finalOD   = parseFloat(targetOD)||0 ? parseFloat(targetOD) : (theoOD + 2);
    const bom       = generateBOM({pages, mem, elem, odMm:finalOD, mesh:odRow.mesh, guide:odRow.guide, includeEndCap:endCap});

    // 寿命末期核算
    const eFlowGPD = lpmToGPD(parseFloat(endFlow)||0);
    const ePSI     = mpaToPs(parseFloat(endPres)||0.8);
    const eCoeff   = interpPsiCoeff(ePSI);
    const eFluxEst = pageArea * pages * baseFlux * eCoeff * eta * 0.75;
    const eOk      = eFluxEst >= eFlowGPD;

    return { mem, elem, effActiveLen, memWidth, baseFlux, iFlowGPD, iPSI, coeff, pageArea, fluxAtP,
             reqArea, rawPg, pages, autoPg, odRow, theoOD, finalOD, bom, pageCorrFactor,
             eFluxEst, eFlowGPD, eOk, eta, hasA, hasC, hasE };
  }, [memId, fluxMode, elemId, customA, customC, customE, initFlow, endFlow, initPres, endPres, designEff,
      manualPageCorr, targetOD, endCap, customPages]);

  // 实测反推（打样校验）
  const [revPages,  setRevPages]  = useState("");
  const [revFlow,   setRevFlow]   = useState("");
  const [revPres,   setRevPres]   = useState("");

  const revCalc = useMemo(() => {
    const pg  = parseFloat(revPages)||0;
    const fl  = parseFloat(revFlow)||0;
    const pr  = parseFloat(revPres)||0;
    if (!pg || !fl || !pr) return null;
    const mem = MEMBRANES.find(m=>m.id===memId)||MEMBRANES[0];
    const effC = parseFloat(customC)||0 ? parseFloat(customC) : (ELEMENT_TYPES.find(e=>e.id===elemId)||ELEMENT_TYPES[6]).activeLen;
    const mw   = effC - 30;
    const pa   = 0.94 * mw / 1000;
    const flGPD= parseFloat(revFlow)||0;
    const psi  = parseFloat(revPres)||0;
    const cf   = interpPsiCoeff(psi);
    const totalArea = pg * pa;
    const obsFluxAtP = flGPD / totalArea;
    const obsFlux65  = obsFluxAtP / cf;
    const obsEta     = obsFlux65 / (mem.flux65_500 && fluxMode==="500" ? mem.flux65_500 : mem.flux65);
    const eqDesignPages = pg / obsEta;   // 换算成设计系数下等效页数
    return { pg, flGPD, psi, cf, pa, totalArea, obsFluxAtP, obsFlux65, obsEta, eqDesignPages, mw };
  }, [revPages, revFlow, revPres, memId, elemId, customC, fluxMode]);

              <div>膜宽（C - 15×2）：<b style={{color:"#f59e0b"}}>{R.memWidth} mm</b></div>
              <div>有效卷绕长度：<span style={{color:"#e2e8f0"}}>{R.elem.activeLen} mm</span></div>
              <div>65psi 基准通量：<span style={{color:"#e2e8f0"}}>{R.mem.flux65} GPD/m²</span></div>
              <div>操作压力通量：<span style={{color:"#e2e8f0"}}>{(R.mem.flux65*R.coeff).toFixed(0)} GPD/m²</span></div>
              <div>脱盐率参考：<span style={{color:"#e2e8f0"}}>{(R.mem.saltRej*100).toFixed(1)}%（NaCl 250ppm）</span></div>
              <div>外径参考范围：<span style={{color:"#e2e8f0"}}>{R.odRow.odMin}~{R.odRow.odMax} mm（{R.pages}页）</span></div>
            </div>
          </div>

          {/* BOM 表格 */}
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:"10px"}}>
              <div>
                <div style={{fontSize:"13px",fontWeight:"700",color:"#e2e8f0",letterSpacing:"0.02em"}}>📦 生产 BOM 清单</div>
                <div style={{fontSize:"11px",color:"#64748b",marginTop:"2px"}}>
                  P/N: <span style={{color:"#60a5fa"}}>{customPN||"—"}</span>
                  &nbsp;·&nbsp;{productDesc||"产品待填"}
                  &nbsp;·&nbsp;Rev.{rev}
                  &nbsp;·&nbsp;页数 <span style={{color:"#60a5fa",fontWeight:"700"}}>{R.pages}</span>
                  &nbsp;·&nbsp;外径 <span style={{color:"#60a5fa",fontWeight:"700"}}>{R.finalOD.toFixed(1)}mm</span>
                </div>
              </div>
              <button className="no-print" onClick={printBOM}
                style={{background:"#1e293b",color:"#94a3b8",border:"1px solid #334155",borderRadius:"8px",
                  padding:"6px 14px",cursor:"pointer",fontSize:"12px"}}>
                🖨️ 打印 BOM
              </button>
            </div>

            <div style={{borderRadius:"12px",overflow:"hidden",border:"1px solid #1e293b"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:"13px"}}>
                <thead>
                  <tr style={{background:"linear-gradient(to right,#1e293b,#1e3a5f)"}}>
                    {["序号","层次","物料编码","物料描述","用量/台","单位","报废率","备注"].map(h=>(
                      <th key={h} style={{padding:"10px 12px",textAlign:h==="物料描述"||h==="备注"?"left":"center",
                        fontSize:"11px",fontWeight:"700",color:"#94a3b8",borderBottom:"1px solid #334155",
                        whiteSpace:"nowrap"}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {R.bom.map((row,i)=>{
                    const bg = i===0?"rgba(30,64,175,0.2)":i===1?"rgba(146,64,14,0.2)":i===2?"rgba(6,78,59,0.15)":"transparent";
                    return (
                      <tr key={i} style={{background:bg,borderBottom:"1px solid rgba(30,41,59,0.8)"}}>
                        <td style={{padding:"8px 12px",textAlign:"center",color:"#64748b",fontFamily:"monospace"}}>{row.no}</td>
                        <td style={{padding:"8px 12px",textAlign:"center",color:"#64748b"}}>1</td>
                        <td style={{padding:"8px 12px",color:"#64748b",fontFamily:"monospace",fontSize:"12px"}}>{row.code}</td>
                        <td style={{padding:"8px 12px",color:"#e2e8f0"}}>{row.desc}</td>
                        <td style={{padding:"8px 12px",textAlign:"right",fontFamily:"monospace",fontWeight:"700",color:"#f1f5f9"}}>{row.qty}</td>
                        <td style={{padding:"8px 12px",textAlign:"center",color:"#94a3b8",fontSize:"12px"}}>{row.unit}</td>
                        <td style={{padding:"8px 12px",textAlign:"center",color:"#64748b",fontSize:"12px"}}>{row.scrap}</td>
                        <td style={{padding:"8px 12px",color:"#64748b",fontSize:"12px"}}>{row.remark}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            {/* 用量摘要卡片 */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"12px",marginTop:"14px"}}>
              {[
                {title:"膜材料用量",color:"#3b82f6",bg:"rgba(30,64,175,0.15)",border:"rgba(59,130,246,0.3)",items:[
                  ["膜片",`${(R.pages*R.memWidth/1000).toFixed(3)} m`],
                  ["浓水网格",`${(R.pages*R.memWidth/1000*2.21).toFixed(3)} m`],
                  ["纯水导布",`${(R.pages*R.memWidth/1000*2.43).toFixed(3)} m`],
                ]},
                {title:"胶带 & 密封",color:"#f59e0b",bg:"rgba(146,64,14,0.15)",border:"rgba(217,119,6,0.3)",items:[
                  ["外胶带",`${(Math.PI*R.finalOD/1000*2.5).toFixed(4)} m`],
                  ["密封圈胶带",`${(Math.PI*R.finalOD/1000*5.3).toFixed(4)} m`],
                  ["周长参考",`${(Math.PI*R.finalOD).toFixed(1)} mm`],
                ]},
                {title:"胶水用量",color:"#10b981",bg:"rgba(6,78,59,0.15)",border:"rgba(16,185,129,0.3)",items:[
                  ["富乐 3519A",`${(R.pages*3.93).toFixed(2)} g`],
                  ["富乐 3519B",`${(R.pages*4.37).toFixed(2)} g`],
                  ["A:B 比例","47 : 53"],
                ]},
              ].map(card=>(
                <div key={card.title} style={{background:card.bg,border:`1px solid ${card.border}`,borderRadius:"12px",padding:"14px"}}>
                  <div style={{fontSize:"11px",color:card.color,fontWeight:"700",marginBottom:"8px"}}>{card.title}</div>
                  {card.items.map(([k,v])=>(
                    <div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:"12px",
                      color:"#94a3b8",marginBottom:"4px"}}>
                      <span>{k}</span>
                      <span style={{fontFamily:"monospace",fontWeight:"700",color:"#e2e8f0"}}>{v}</span>
                    </div>
                  ))}
                </div>
              ))}
            </div>

            {/* 推导步骤 */}
            <div style={{background:"rgba(15,23,42,0.4)",border:"1px solid #1e293b",borderRadius:"12px",
              padding:"16px",marginTop:"14px"}}>
              <div style={{fontSize:"11px",fontWeight:"700",color:"#64748b",textTransform:"uppercase",
                letterSpacing:"0.1em",marginBottom:"10px"}}>🔧 设计步骤推导（可打印）</div>
              <ol style={{margin:0,padding:"0 0 0 18px",fontSize:"12px",color:"#64748b",lineHeight:"2.2"}}>
                {[
                  `客户初始产水量：${initFlow} L/min，换算 → ${R.iFlowGPD.toFixed(1)} GPD`,
                  `初始膜前压力：${initPres} MPa = ${R.iPSI.toFixed(1)} psi，查压力系数表（vs 65psi）= ${R.coeff.toFixed(3)}`,
                  `选用膜片 ${R.mem.name}（${R.mem.brand}）；膜宽 = C - 15×2 = ${R.effActiveLen} - 30 = ${R.memWidth} mm`,
                  `基准通量（${fluxMode==="500"?"500ppm水效校正":"250ppm标准测试"}）= ${R.baseFlux} GPD/m²  ←  量产膜片通量.xlsx`,
                  `操作压力下通量 = ${R.baseFlux} × ${R.coeff.toFixed(3)} = ${(R.baseFlux*R.coeff).toFixed(0)} GPD/m²`,
                  `乘以设计系数 η=${R.eta.toFixed(2)} × 页数非线性修正${R.pageCorrFactor?.toFixed(3)} → 有效通量 = ${R.fluxAtP.toFixed(0)} GPD/m²`,
                  `单页膜面积 = 0.94 × 膜宽${R.memWidth}mm（第3步）= ${R.pageArea.toFixed(4)} m²`,
                  `所需总面积 = ${R.iFlowGPD.toFixed(0)} ÷ ${R.fluxAtP.toFixed(0)} = ${R.reqArea.toFixed(4)} m²`,
                  `原始页数 = ${R.reqArea.toFixed(4)} ÷ ${R.pageArea.toFixed(4)} = ${R.rawPg.toFixed(2)}，取0.5步长整数 → ${R.pages} 页`,
                  `查外径经验表（${R.pages}页）→ 推荐网格 ${R.odRow.mesh} mil，导布 ${R.odRow.guide} mil，外径参考 ${R.odRow.odMin}~${R.odRow.odMax} mm`,
                  `理论外径 ≈ ${R.theoOD.toFixed(1)} mm + 胶带层 ≈ 最终外径 ${R.finalOD.toFixed(1)} mm`,
                ].map((step,i)=>(
                  <li key={i} style={{color: i===8||i===9?"#93c5fd": i===2?"#f59e0b":"#64748b"}}>
                    {i===8||i===9?<b style={{color:"#93c5fd"}}>{step}</b>:
                     i===2?<b style={{color:"#f59e0b"}}>{step}</b>:step}
                  </li>
                ))}
              </ol>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
